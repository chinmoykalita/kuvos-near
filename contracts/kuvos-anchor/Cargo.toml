[package]
name = "kuvos-anchor"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Anchors Kuvos care-event Merkle roots and Tomo policy hashes on NEAR. No health data."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
