[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kuvos-near-worker"
version = "0.1.0"
description = "Kuvos NEAR extraction worker (NEAR AI Cloud TEE models)"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40.0,<2",
  "nearai-inference-sdk>=0.3.0,<0.4",
  "pdfplumber>=0.11.10,<1",
  "pillow>=12.0.0,<13",
  "pydantic>=2.10.0,<3",
  "pypdfium2>=5.13.0,<6",
  "psycopg[binary]>=3.2.0,<4",
  "python-dotenv>=1.1.0,<2",
]

[project.scripts]
kuvos-worker = "kuvos_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
